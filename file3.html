<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File 3</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
    }

    h1 {
      color: #1f4e79;
    }

    h2 {
      color: #1f4e79;
      margin-top: 30px;
    }

    .card {
      background: #f7f9fc;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    button {
      background: #1f4e79;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 7px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <a href="course.html">← Back to Course</a>

  <h1>File 3</h1>

  <p>English File Beginner</p>

  <h2>3A — What's in your bag?</h2>

  <div class="card">
    <strong>book</strong> — книга
    <button onclick="speak('book')">🔊</button>
  </div>

  <div class="card">
    <strong>pen</strong> — ручка
    <button onclick="speak('pen')">🔊</button>
  </div>

  <div class="card">
    <strong>pencil</strong> — карандаш
    <button onclick="speak('pencil')">🔊</button>
  </div>

  <h2>3B — Is that a hat?</h2>

  <div class="card">
    <strong>hat</strong> — шляпа
    <button onclick="speak('hat')">🔊</button>
  </div>

  <div class="card">
    <strong>T-shirt</strong> — футболка
    <button onclick="speak('T-shirt')">🔊</button>
  </div>

  <div class="card">
    <strong>postcard</strong> — открытка
    <button onclick="speak('postcard')">🔊</button>
  </div>

  <h2>🗣 Practice</h2>

  <div class="card">
    Is that a hat?
    <button onclick="speak('Is that a hat?')">🔊</button>
  </div>

  <div class="card">
    Is this a postcard?
    <button onclick="speak('Is this a postcard?')">🔊</button>
  </div>

</div>

<script>

function speak(text) {

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-GB";
  speech.rate = 0.85;
  speech.pitch = 1;

  speechSynthesis.speak(speech);

}

</script>

</body>
</html>
