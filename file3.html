<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>File 3 — English File Beginner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      color: #1f4e79;
      margin-bottom: 5px;
    }

    h2 {
      color: #1f4e79;
      margin-top: 35px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .card {
      background: #f7f9fc;
      padding: 18px;
      margin: 12px 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .word {
      font-size: 20px;
      font-weight: bold;
    }

    .translation {
      color: #666;
      margin-left: 8px;
    }

    button {
      background: #1f4e79;
      color: white;
      border: none;
      padding: 9px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #163a5c;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #1f4e79;
      text-decoration: none;
    }

    .practice {
      background: #eef5fb;
      padding: 18px;
      margin: 12px 0;
      border-radius: 10px;
    }

    .practice-text {
      font-size: 18px;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <a class="back" href="course.html">← Back to Course</a>

  <h1>File 3</h1>

  <p class="subtitle">
    English File Beginner
  </p>


  <!-- 3A -->

  <h2>3A — What's in your bag?</h2>

  <div class="card">
    <div>
      <span class="word">book</span>
      <span class="translation">— книга</span>
    </div>

    <button onclick="speak('book')">🔊</button>
  </div>


  <div class="card">
    <div>
      <span class="word">pen</span>
      <span class="translation">— ручка</span>
    </div>

    <button onclick="speak('pen')">🔊</button>
  </div>


  <div class="card">
    <div>
      <span class="word">pencil</span>
      <span class="translation">— карандаш</span>
    </div>

    <button onclick="speak('pencil')">🔊</button>
  </div>


  <div class="card">
    <div>
      <span class="word">bag</span>
      <span class="translation">— сумка</span>
    </div>

    <button onclick="speak('bag')">🔊</button>
  </div>


  <div class="card">
    <div>
      <span class="word">phone</span>
      <span class="translation">— телефон</span>
    </div>

    <button onclick="speak('phone')">🔊</button>
  </div>


  <!-- 3B -->

  <h2>3B — Is that a hat?</h2>

  <div class="card">
    <div>
      <span class="word">hat</span>
      <span class="translation">— шляпа</span>
    </div>

    <button onclick="speak('hat')">🔊</button>
  </div>


  <div class="card">
    <div>
      <span class="word">T-shirt</span>
      <span class="translation">— футболка</span>
    </div>

    <button onclick="speak('T-shirt')">🔊</button>
  </div>


  <div class="card">
    <div>
      <span class="word">postcard</span>
      <span class="translation">— открытка</span>
    </div>

    <button onclick="speak('postcard')">🔊</button>
  </div>


  <!-- Practice -->

  <h2>🗣 Practice</h2>


  <div class="practice">

    <div class="practice-text">
      Is that a hat?
    </div>

    <button onclick="speak('Is that a hat?')">
      🔊 Listen
    </button>

  </div>


  <div class="practice">

    <div class="practice-text">
      Is this a postcard?
    </div>

    <button onclick="speak('Is this a postcard?')">
      🔊 Listen
    </button>

  </div>


</div>


<script>

  let voices = [];


  function loadVoices() {

    voices = speechSynthesis.getVoices();

  }


  loadVoices();


  if (speechSynthesis.onvoiceschanged !== undefined) {

    speechSynthesis.onvoiceschanged = loadVoices;

  }


  function speak(text) {

    speechSynthesis.cancel();


    const speech =
      new SpeechSynthesisUtterance(text);


    const englishVoice =

      voices.find(
        voice => voice.lang === "en-GB"
      )

      ||

      voices.find(
        voice => voice.lang.startsWith("en-GB")
      )

      ||

      voices.find(
        voice => voice.lang.startsWith("en")
      );


    if (englishVoice) {

      speech.voice = englishVoice;

    }


    speech.lang = "en-GB";

    speech.rate = 0.8;

    speech.pitch = 1;


    speechSynthesis.speak(speech);

  }

</script>

</body>
</html>
